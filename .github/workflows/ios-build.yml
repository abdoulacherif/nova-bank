name: iOS Framework Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    # Runner macOS obligatoire pour compiler du code Kotlin/Native iOS —
    # consomme le quota GitHub Actions ~10x plus vite qu'un runner Linux.
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build iOS framework (validation Kotlin/Native)
        run: gradle :composeApp:linkDebugFrameworkIosSimulatorArm64 --stacktrace

      - name: Upload framework
        uses: actions/upload-artifact@v4
        with:
          name: kontak-ios-framework
          path: composeApp/build/bin/iosSimulatorArm64/debugFramework/